job_description:
  job_code: gold__compliance__fact_tt17_notification
  job_name: gold__compliance__fact_tt17_notification
  job_parents:
    - silver__base__fact_retail_ib_customer
    - privacy__silver_pii__dim_contact_privacy
    - silver__base__dim_organization
    - silver__base__dim_customer
    - silver__base__dim_cbs_presenter
    - gold__tmp__tt17_noipay_customer
  job_param:
    - cob_dt
source:
  type: wxd
  sql: |
    WITH contact_base AS (
        SELECT
            c.cob_dt,
            CAST(c.cif_nbr AS BIGINT) AS cif_nbr,
            c.pri_phone_nbr,
            c.pri_email
        FROM privacy.silver_pii.dim_contact_privacy c
        WHERE TO_DATE('{cob_dt}', 'yyyy-MM-dd') BETWEEN eff_start_dt AND eff_end_dt
          AND c.cif_nbr IS NOT NULL
          AND c.pri_phone_nbr IS NOT NULL
    ),

    ipay_valid AS (
        SELECT DISTINCT
            CAST(f.cif_nbr AS BIGINT) AS cif_nbr,
            f.cob_dt
        FROM silver.base.fact_retail_ib_customer f
        WHERE f.cob_dt = to_date('{cob_dt}', 'yyyy-MM-dd')
          AND f.accs_status IN ('Available', 'TempPin', 'Blocked')
    ),

    cust_info AS (
        SELECT
            cb.cob_dt,
            cb.cif_nbr,
            cb.pri_phone_nbr,
            cb.pri_email,
            dc.cus_sub_type,
            dc.verify_flag,
            dc.ctzs_cd,
            dc.brnch_cd,
            org.other_id_type,
            org.other_expire_dt,
            org.doc_nbr,
            org.doc_expire_dt
        FROM contact_base cb
        LEFT JOIN silver.base.dim_customer dc
            ON cb.cif_nbr = dc.cif_nbr
            AND TO_DATE('{cob_dt}', 'yyyy-MM-dd') BETWEEN eff_start_dt AND eff_end_dt
        LEFT JOIN silver.base.dim_organization org
            ON cb.cif_nbr = org.cif_nbr
            AND TO_DATE('{cob_dt}', 'yyyy-MM-dd') BETWEEN eff_start_dt AND eff_end_dt
    ),

    -- KHÔNG CÓ IEDT trên silver.base.dim_cbs_presenter
    presenter_info AS (
        SELECT
            p.cob_dt,
            CAST(p.cif_nbr AS BIGINT) AS cif_nbr,
            p.presr_role_cd,
            -- bz.idt, -- bỏ trường
            p.iedt
        FROM silver.base.dim_cbs_presenter p
        WHERE TO_DATE('{cob_dt}', 'yyyy-MM-dd') BETWEEN eff_start_dt AND eff_end_dt
    ),

    -- Log = chính bảng này, các ngày TRƯỚC cob_dt
    sent_log AS (
        SELECT DISTINCT
            cif_nbr,
            pri_phone_nbr,
            pri_email,
            noti_id
        FROM gold.compliance.fact_tt17_notification
        WHERE cob_dt < to_date('{cob_dt}', 'yyyy-MM-dd')
    ),

    /* ===================== MOBILE (OTT + SMS) ===================== */

    /* 1) OTT - KHCN , th2, th3 (ok) */
    ott_khcn AS (
        SELECT DISTINCT
            ci.cif_nbr,
            ci.pri_phone_nbr,
            'OTT' AS noti_type,
            CASE
                WHEN ci.other_id_type = '05'
                     AND (ci.verify_flag = 1 OR (ci.verify_flag = 2 AND ci.ctzs_cd <> 'VN'))
                THEN '02'
                WHEN ci.other_id_type = '06'
                     AND ci.verify_flag = 2
                     AND ci.ctzs_cd <> 'VN'
                THEN '03'
            END AS noti_id,
            CAST(ci.other_expire_dt AS DATE) AS expire_dt,
            'N' AS status,
            'KHCN' AS cus_type,
            ci.cob_dt
        FROM cust_info ci
        INNER JOIN ipay_valid iv
            ON ci.cif_nbr = iv.cif_nbr
        WHERE ci.cus_sub_type IN ('01', '03') -- cus_sub_type tương ứng với zcstype
          AND ci.other_id_type IN ('05', '06') -- other_id_type = oit
          AND ci.other_expire_dt IS NOT NULL
          AND DATEDIFF(ci.other_expire_dt, ci.cob_dt) + 1 IN (30, 2, 1, 0) -- OED_SUB
          AND (
                (ci.other_id_type = '05'
                 AND (ci.verify_flag = 1 OR (ci.verify_flag = 2 AND ci.ctzs_cd <> 'VN')))
             OR (ci.other_id_type = '06'
                 AND ci.verify_flag = 2
                 AND ci.ctzs_cd <> 'VN')
          )
    ),

    /* 2) OTT - KHHKD, th6 (OK) */
    ott_khhkd AS (
        SELECT DISTINCT
            ci.cif_nbr,
            ci.pri_phone_nbr,
            'OTT' AS noti_type,
            '06' AS noti_id,
            CAST(pi.iedt AS DATE) AS expire_dt, -- iedt không có trên silver
            'N' AS status,
            'KHHKD' AS cus_type,
            ci.cob_dt
        FROM cust_info ci
        INNER JOIN ipay_valid iv
            ON ci.cif_nbr = iv.cif_nbr
        LEFT JOIN presenter_info pi
            ON ci.cif_nbr = pi.cif_nbr
        WHERE ci.cus_sub_type IN ('02')
          AND pi.presr_role_cd = '03' -- prolecd = 03
          AND pi.iedt IS NOT NULL
          AND DATEDIFF(pi.iedt, ci.cob_dt) + 1 IN (30, 2, 1, 0)
    ),

    /* 3) OTT - KHNN (ok) */
    ott_khnn AS (
        SELECT DISTINCT
            ci.cif_nbr,
            ci.pri_phone_nbr,
            'OTT' AS noti_type,
            '51' AS noti_id,
            CAST(ci.doc_expire_dt AS DATE) AS expire_dt,
            'N' AS status,
            'KHNN' AS cus_type,
            ci.cob_dt
        FROM cust_info ci
        INNER JOIN ipay_valid iv
            ON ci.cif_nbr = iv.cif_nbr
        WHERE ci.doc_nbr IS NOT NULL
          AND ci.doc_expire_dt IS NOT NULL
          AND DATEDIFF(ci.doc_expire_dt, ci.cob_dt) + 1 < 60
          AND DAY(ci.cob_dt) + 1 IN (5, 20)
    ),

    /* 4) NO-IPAY -> SMS */
    noipay_sms_raw AS (
        SELECT
            n.cob_dt,
            CAST(n.cif_nbr AS BIGINT) AS cif_nbr,
            n.pri_phone_nbr,
            n.cus_type,
            CAST(n.other_expire_dt AS DATE) AS expire_dt,
            CASE
                WHEN CAST(n.other_expire_dt AS DATE) <= n.cob_dt THEN '35'
                ELSE '34'
            END AS noti_id
        FROM gold.tmp.tt17_noipay_customer n
        WHERE n.cob_dt = to_date('{cob_dt}', 'yyyy-MM-dd') -- ĐIỀU KIỆN GỬI QUA SMS (MẤT TIỀN CƯỚC)
          AND n.pri_phone_nbr IS NOT NULL                   -- có sdt
          AND COALESCE(n.dda_active_count, 0) > 0           -- có ít nhất 1 DDA active
          AND (n.pri_email IS NULL OR n.pri_email NOT LIKE '%@%') -- không có email hợp lệ
          AND n.cus_type = 'KHCN'
    ),

    noipay_sms AS (
        SELECT
            x.cif_nbr,
            x.pri_phone_nbr,
            'SMS' AS noti_type,
            x.noti_id,
            x.expire_dt,
            'N' AS status,
            'KHCN' AS cus_type,
            x.cob_dt
        FROM (
            SELECT
                r.*,
                ROW_NUMBER() OVER (
                    PARTITION BY r.pri_phone_nbr
                    ORDER BY r.expire_dt ASC -- lấy expire_dt gần nhất
                ) AS rn
            FROM noipay_sms_raw r
        ) x
        LEFT JOIN sent_log l
            ON x.pri_phone_nbr = l.pri_phone_nbr
            AND x.noti_id = l.noti_id
        WHERE x.rn = 1
          AND l.cif_nbr IS NULL -- sdt chưa nhận noti_id này
    ),

    mobile_noti AS (
        SELECT cif_nbr, pri_phone_nbr, noti_type, noti_id, expire_dt, status, cus_type, cob_dt
        FROM ott_khcn
        UNION ALL
        SELECT * FROM ott_khhkd
        UNION ALL
        SELECT * FROM ott_khnn
        UNION ALL
        SELECT * FROM noipay_sms
    ),

    /* ===================== EMAIL ===================== */

    send_email AS (
        SELECT *
        FROM gold.tmp.tt17_noipay_customer
        WHERE cob_dt = to_date('{cob_dt}', 'yyyy-MM-dd')
          AND pri_email IS NOT NULL
          AND pri_email LIKE '%@%'
    ),

    rs_send_email AS (
        SELECT
            x.cif_nbr,
            x.pri_email,
            x.noti_id,
            x.expire_dt,
            x.cus_type,
            x.cob_dt
        FROM (
            SELECT
                t1.cif_nbr,
                t1.pri_email,
                CAST(t1.other_expire_dt AS DATE) AS expire_dt,
                t1.cus_type,
                t1.cob_dt,
                CASE
                    WHEN t1.cus_type = 'KHCN' AND t1.other_expire_dt <= t1.cob_dt THEN '41'
                    WHEN t1.cus_type = 'KHCN' AND t1.other_expire_dt >  t1.cob_dt THEN '42'
                    ELSE NULL
                END AS noti_id,
                ROW_NUMBER() OVER (
                    PARTITION BY t1.pri_email
                    ORDER BY t1.other_expire_dt ASC
                ) AS rn
            FROM send_email t1
        ) x
        LEFT JOIN sent_log l
            ON x.pri_email = l.pri_email
            AND x.noti_id = l.noti_id
        WHERE x.rn = 1
          AND l.cif_nbr IS NULL -- email chưa nhận noti_id này
    )

    /* ===================== FINAL ===================== */
    SELECT
        cob_dt,
        -- 'fact_tt17_notification' AS etl_updtd_by,
        -- CURRENT_TIMESTAMP()     AS etl_updtd_dtm,
        CAST(cif_nbr AS BIGINT)        AS cif_nbr,
        cus_type,
        noti_type,
        noti_id,
        expire_dt,
        pri_phone_nbr,
        CAST(NULL AS STRING)           AS pri_email,
        CAST(NULL AS STRING)           AS email_type,
        CAST(NULL AS STRING)           AS send_status,
        CAST(NULL AS INT)              AS retry_count,
        CAST(NULL AS STRING)           AS sender_act_nbr,
        status
    FROM mobile_noti

    UNION ALL

    SELECT
        cob_dt,
        -- 'fact_tt17_notification' AS etl_updtd_by,
        -- CURRENT_TIMESTAMP()     AS etl_updtd_dtm,
        CAST(cif_nbr AS BIGINT)        AS cif_nbr,
        cus_type,
        'EMAIL'                        AS noti_type,
        noti_id,
        expire_dt,
        CAST(NULL AS STRING)           AS pri_phone_nbr,
        pri_email,
        'EMAILTT17'                    AS email_type,
        'N'                            AS send_status,
        0                              AS retry_count,
        '1'                            AS sender_act_nbr,
        'N'                            AS status
    FROM rs_send_email

target:
  type: wxd
  target_table: gold.compliance.fact_tt17_notification
  write_mode : overwrite_partitions